<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonCyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonPinkG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="500" rx="20" fill="url(#heroSky)"/>

  <!-- Cyberpunk Giant Neon Sun / Grid Moon -->
  <circle cx="300" cy="220" r="140" fill="none" stroke="url(#neonPinkG)" stroke-width="4" filter="url(#heroGlow)"/>
  <circle cx="300" cy="220" r="140" fill="rgba(244, 63, 94, 0.05)"/>
  <line x1="170" y1="220" x2="430" y2="220" stroke="#0f172a" stroke-width="6"/>
  <line x1="180" y1="240" x2="420" y2="240" stroke="#0f172a" stroke-width="8"/>
  <line x1="195" y1="265" x2="405" y2="265" stroke="#0f172a" stroke-width="10"/>
  <line x1="220" y1="295" x2="380" y2="295" stroke="#0f172a" stroke-width="12"/>

  <!-- Cyber City Skyline -->
  <polygon points="40,500 40,320 80,300 110,320 110,500" fill="#090d16"/>
  <polygon points="100,500 100,260 140,240 170,260 170,500" fill="#0c1322"/>
  <polygon points="160,500 160,280 200,280 200,500" fill="#090d16"/>
  <polygon points="420,500 420,290 470,260 490,290 490,500" fill="#0c1322"/>
  <polygon points="480,500 480,310 520,310 550,500" fill="#090d16"/>
  
  <line x1="140" y1="240" x2="140" y2="180" stroke="#06b6d4" stroke-width="2" filter="url(#heroGlow)"/>
  <circle cx="140" cy="180" r="4" fill="#06b6d4"/>
  <line x1="470" y1="260" x2="470" y2="200" stroke="#f43f5e" stroke-width="2" filter="url(#heroGlow)"/>
  <circle cx="470" cy="200" r="4" fill="#f43f5e"/>

  <!-- 3D Perspective Grid -->
  <g opacity="0.4" stroke="#06b6d4" stroke-width="1.5">
    <line x1="50" y1="360" x2="550" y2="360"/>
    <line x1="30" y1="390" x2="570" y2="390"/>
    <line x1="10" y1="430" x2="590" y2="430"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="300" y1="340" x2="20" y2="500"/>
    <line x1="300" y1="340" x2="120" y2="500"/>
    <line x1="300" y1="340" x2="220" y2="500"/>
    <line x1="300" y1="340" x2="300" y2="500"/>
    <line x1="300" y1="340" x2="380" y2="500"/>
    <line x1="300" y1="340" x2="480" y2="500"/>
    <line x1="300" y1="340" x2="580" y2="500"/>
  </g>

  <!-- Central Tactical Logo Device -->
  <g transform="translate(180, 200)" filter="url(#heroGlow)">
    <polygon points="120,20 220,75 220,185 120,240 20,185 20,75" fill="rgba(15, 23, 42, 0.85)" stroke="#06b6d4" stroke-width="3"/>
    <polygon points="120,40 200,85 200,175 120,220 40,175 40,85" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="120" y="125" fill="#f8fafc" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4">NEON</text>
    <text x="120" y="155" fill="#06b6d4" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="6">PROTOCOL</text>
  </g>

  <g transform="translate(200, 430)">
    <rect width="200" height="36" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="20" cy="18" r="5" fill="#10b981"/>
    <text x="110" y="23" fill="#f8fafc" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">NEXT-GEN RPG ENGINE</text>
  </g>
</svg>
