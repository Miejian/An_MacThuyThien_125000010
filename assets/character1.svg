<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="char1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="600" rx="16" fill="url(#char1Bg)"/>
  
  <!-- Cyberpunk Hex Grid Background -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="1.5" fill="none">
    <polygon points="100,60 140,85 140,135 100,160 60,135 60,85"/>
    <polygon points="200,60 240,85 240,135 200,160 160,135 160,85"/>
    <polygon points="300,60 340,85 340,135 300,160 260,135 260,85"/>
    <polygon points="400,60 440,85 440,135 400,160 360,135 360,85"/>
    <polygon points="150,145 190,170 190,220 150,245 110,220 110,170"/>
    <polygon points="250,145 290,170 290,220 250,245 210,220 210,170"/>
    <polygon points="350,145 390,170 390,220 350,245 310,220 310,170"/>
  </g>

  <!-- Glowing Neon Target Reticle -->
  <circle cx="250" cy="270" r="180" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="16, 8" opacity="0.4"/>
  <circle cx="250" cy="270" r="200" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="8, 12" opacity="0.3"/>

  <!-- Character Silhouette & Cyber Armor -->
  <path d="M120 540 L160 390 L220 360 L280 360 L340 390 L380 540 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M160 390 L250 480 L340 390" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glowCyan)"/>
  
  <!-- Cyber Hood / Helmet -->
  <path d="M175 350 C165 240, 200 170, 250 170 C300 170, 335 240, 325 350 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Neon Visor / Mask -->
  <path d="M190 270 L310 270 L295 315 L205 315 Z" fill="url(#neonPink)" filter="url(#glowCyan)"/>
  <line x1="195" y1="285" x2="305" y2="285" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <line x1="200" y1="300" x2="300" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Dual Cyber Katanas / Energy Blades -->
  <g filter="url(#glowCyan)">
    <line x1="70" y1="200" x2="220" y2="440" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <line x1="430" y1="200" x2="280" y2="440" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cyber Badge Overlay -->
  <rect x="160" y="520" width="180" height="36" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="250" y="544" fill="#f43f5e" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">CLASS: ASSASSIN</text>
  <text x="250" y="580" fill="#94a3b8" font-family="'Orbitron', sans-serif" font-size="11" text-anchor="middle">SPEED: S+ | STEALTH: MAX</text>
</svg>
